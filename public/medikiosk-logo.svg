<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3380fc"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#599fff"/>
      <stop offset="100%" stop-color="#1c61f0"/>
    </linearGradient>
  </defs>
  <!-- Outer ring -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="url(#ringGrad)" stroke-width="4"/>
  <circle cx="50" cy="50" r="38" fill="rgba(255,255,255,0.15)"/>
  <!-- Medical cross -->
  <rect x="42" y="24" width="16" height="52" rx="4" fill="url(#crossGrad)"/>
  <rect x="24" y="42" width="52" height="16" rx="4" fill="url(#crossGrad)"/>
  <!-- Staff accent -->
  <line x1="50" y1="28" x2="50" y2="72" stroke="white" stroke-width="2" opacity="0.5"/>
  <!-- Wings on staff -->
  <path d="M 38 32 Q 50 28 62 32" fill="none" stroke="white" stroke-width="2" opacity="0.6"/>
  <!-- Top dot -->
  <circle cx="50" cy="30" r="3" fill="white" opacity="0.7"/>
</svg>
