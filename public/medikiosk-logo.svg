<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#599fff"/>
      <stop offset="100%" stop-color="#3380fc"/>
    </linearGradient>
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- Bottle cap -->
  <rect x="38" y="8" width="24" height="10" rx="3" fill="#1c61f0"/>
  <!-- Bottle neck -->
  <rect x="40" y="18" width="20" height="8" fill="url(#bottleGrad)" opacity="0.8"/>
  <!-- Bottle body -->
  <rect x="28" y="26" width="44" height="66" rx="10" fill="url(#bottleGrad)" opacity="0.3" stroke="url(#bottleGrad)" stroke-width="2"/>
  <!-- Liquid -->
  <rect x="31" y="50" width="38" height="39" rx="7" fill="url(#liquidGrad)" opacity="0.7"/>
  <!-- Medical cross -->
  <rect x="44" y="42" width="12" height="4" rx="2" fill="white"/>
  <rect x="48" y="38" width="4" height="12" rx="2" fill="white"/>
</svg>
